# CI/CD 전체 파이프라인 (정답) — 7단계에서 ci.yml을 이 형태로 확장한다
# 필요한 Secrets: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / ECR_REGISTRY / EC2_HOST / EC2_SSH_KEY
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 테스트 실행
        # 커버리지 85% 미만이면 테스트가 모두 통과해도 실패 → 테스트를 지우는 변경을 막는다 (5단계)
        run: pytest -q --cov=app --cov-fail-under=85

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Docker 이미지 빌드 (빌드 가능 여부만 검증)
        run: docker build -t product-copy-service:${{ github.sha }} .
